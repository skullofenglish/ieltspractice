<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Speaking Practice Game</title>
    <!-- Google Fonts: Cinzel Decorative -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-purple: #502064;
            --burgundy: #6B0F1A;
            --charcoal: #1A1A1A;
            --lavender: #6B3A7E;
            --light-lavender: #D8B4D9;
            --pink-accent: #F48FB1;
            --bg-light: #FDF8FE;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Century Gothic', CenturyGothic, AppleGothic, sans-serif;
            background-color: var(--bg-light);
            color: var(--charcoal);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            font-family: 'Cinzel Decorative', serif;
            font-size: 2.2rem;
            color: var(--lavender);
            margin-bottom: 5px;
        }

        p.subtitle {
            font-style: italic;
            color: var(--burgundy);
            font-size: 0.95rem;
            margin-top: 0;
        }

        /* Controls Panel */
        .controls-panel {
            background: var(--white);
            border: 2px solid var(--light-lavender);
            border-radius: 12px;
            padding: 15px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(80, 32, 100, 0.08);
            max-width: 850px;
            width: 100%;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--dark-purple);
        }

        select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--light-lavender);
            font-family: 'Century Gothic', sans-serif;
            background: var(--bg-light);
            color: var(--charcoal);
            outline: none;
            cursor: pointer;
        }

        /* Start Button */
        .start-btn {
            background-color: var(--dark-purple);
            color: var(--white);
            border: none;
            padding: 12px 32px;
            font-size: 1.1rem;
            font-family: 'Cinzel Decorative', serif;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(80, 32, 100, 0.3);
        }

        .start-btn:hover {
            background-color: var(--burgundy);
            transform: translateY(-2px);
        }

        .start-btn:disabled {
            background-color: #aaa;
            cursor: not-allowed;
            transform: none;
        }

        /* Timer Display em Destaque */
        .timer-container {
            background: var(--dark-purple);
            color: var(--white);
            border: 3px solid var(--pink-accent);
            border-radius: 50px;
            padding: 10px 25px;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(107, 15, 26, 0.2);
            display: none;
            align-items: center;
            gap: 10px;
        }

        .timer-container.warning {
            background: var(--burgundy);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* Cards Grid */
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1000px;
            width: 100%;
            margin-bottom: 30px;
        }

        .card {
            background: var(--white);
            border-radius: 12px;
            border-left: 6px solid var(--lavender);
            box-shadow: 0 4px 15px rgba(80, 32, 100, 0.08);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 140px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card.spinning {
            border-left-color: var(--pink-accent);
            background: #FAF3FA;
        }

        .card-category {
            font-family: 'Cinzel Decorative', serif;
            font-size: 0.9rem;
            color: var(--burgundy);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-content {
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--dark-purple);
            margin-bottom: 12px;
        }

        .card-hint {
            font-size: 0.85rem;
            color: #555;
            background: var(--bg-light);
            padding: 8px;
            border-radius: 6px;
            border: 1px dashed var(--light-lavender);
        }

        #db-status {
            font-size: 0.8rem;
            color: var(--dark-purple);
            margin-top: auto;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>IELTS Speaking Game</h1>
        <p class="subtitle">Roleta de Fluidez: Conectores, Expressões, Gramática e Temas em Tempo Real</p>
    </header>

    <!-- Controls -->
    <div class="controls-panel">
        <div class="control-group">
            <label for="difficulty">Dificuldade</label>
            <select id="difficulty">
                <option value="easy">Fácil (2 Cards)</option>
                <option value="medium" selected>Médio (4 Cards)</option>
                <option value="hard">Master IELTS (6 Cards)</option>
            </select>
        </div>

        <div class="control-group">
            <label for="timer-setting">Tempo de Resposta</label>
            <select id="timer-setting">
                <option value="30">30 Segundos</option>
                <option value="45">45 Segundos</option>
                <option value="60" selected>60 Segundos</option>
                <option value="120">120 Segundos (Part 2)</option>
                <option value="off">Sem Cronómetro</option>
            </select>
        </div>

        <div style="display: flex; align-items: flex-end;">
            <button class="start-btn" id="start-btn" onclick="startRoulette()">Start / Shuffle</button>
        </div>
    </div>

    <!-- Display do Cronómetro Grande -->
    <div class="timer-container" id="timer-box">
        ⏱️ <span id="timer-text">Tempo: 60s</span>
    </div>

    <!-- Layout dos Cards -->
    <div class="cards-container" id="game-board">
        <div class="card" style="grid-column: 1 / -1; text-align: center; color: #777;">
            Clique em <strong>"Start / Shuffle"</strong> para girar a roleta de desafios!
        </div>
    </div>

    <div id="db-status">A ligar ao Firestore...</div>

    <!-- Firebase SDK Modular -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC2pSwDBIREaPmpOvainZzWGuuCEupxp1c",
            authDomain: "studenttrackerpanel.firebaseapp.com",
            projectId: "studenttrackerpanel",
            storageBucket: "studenttrackerpanel.firebasestorage.app",
            messagingSenderId: "1004678184015",
            appId: "1:1004678184015:web:be95625c08d8ee73ffe3a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        document.getElementById('db-status').innerText = "✓ Ligado ao Firestore com sucesso!";
        window.dbRef = db;
        window.addDoc = addDoc;
        window.collection = collection;
        window.serverTimestamp = serverTimestamp;
    </script>

    <script>
        // Banco de dados completo
        const dataPool = {
            linkingWords: [
                { title: "Linking Word", content: "However / Nevertheless", hint: "Contraste a sua ideia anterior." },
                { title: "Linking Word", content: "As a result / Consequently", hint: "Mostre causa e efeito direto." },
                { title: "Linking Word", content: "Furthermore / In addition", hint: "Adicione um argumento forte." },
                { title: "Linking Word", content: "On the other hand", hint: "Apresente o ponto de vista oposto." },
                { title: "Linking Word", content: "Despite the fact that...", hint: "Use uma concessão gramatical rica." }
            ],
            fillers: [
                { title: "Speaking Filler", content: "Let me think about that for a moment...", hint: "Ganhe tempo de reflexão." },
                { title: "Speaking Filler", content: "Off the top of my head...", hint: "Dê uma estimativa imediata." },
                { title: "Speaking Filler", content: "To be completely honest...", hint: "Expresse uma opinião autêntica." },
                { title: "Speaking Filler", content: "What I mean to say is...", hint: "Refraseie a sua ideia." }
            ],
            idioms: [
                { title: "Idiom / Phrasal Verb", content: "Over the moon", hint: "Fale de algo extremamente positivo." },
                { title: "Idiom / Phrasal Verb", content: "Once in a blue moon", hint: "Descreva um hábito muito raro." },
                { title: "Idiom / Phrasal Verb", content: "Catch up with...", hint: "Use para falar de colocar conversa em dia." },
                { title: "Idiom / Phrasal Verb", content: "A piece of cake", hint: "Descreva algo fácil." },
                { title: "Idiom / Phrasal Verb", content: "Put up with...", hint: "Descreva algo incomodo que tolera." }
            ],
            paraphrase: [
                { title: "Paraphrase Strategy", content: "In other words...", hint: "Explique com outras palavras." },
                { title: "Academic Synonym", content: "Escalate / Surge (≠ Increase)", hint: "Evite o uso repetitivo de 'increase'." },
                { title: "Academic Synonym", content: "Crucial / Paramount (≠ Important)", hint: "Eleve o vocabulário de importância." },
                { title: "Paraphrase Strategy", content: "Put simply...", hint: "Simplifique um conceito complexo." }
            ],
            tenses: [
                { title: "Target Verb Tense", content: "Present Perfect (have/has done)", hint: "Experiências de vida ou recente conexão." },
                { title: "Target Verb Tense", content: "Past Continuous (was/were doing)", hint: "Ações contínuas no passado." },
                { title: "Target Verb Tense", content: "Second Conditional (If + Past, would...)", hint: "Especulação hipotética." },
                { title: "Target Verb Tense", content: "Used to + Infinitive", hint: "Hábitos passados já encerrados." }
            ],
            topics: [
                { title: "IELTS Topic", content: "Technology & AI", hint: "Impactos da IA e tecnologia no dia a dia." },
                { title: "IELTS Topic", content: "Environment & Sustainability", hint: "Ações verdes e poluição urbana." },
                { title: "IELTS Topic", content: "Education & Career", hint: "O futuro das profissões e universidades." },
                { title: "IELTS Topic", content: "Tourism & Culture", hint: "Turismo de massa e tradições locais." },
                { title: "IELTS Topic", content: "Health & Lifestyle", hint: "Bem-estar, desporto e rotinas." }
            ]
        };

        // Sintetizador de Som (Web Audio API)
        let audioCtx = null;

        function playTickSound(frequency = 400) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch (e) {}
        }

        let timerInterval = null;

        function getRandomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function startRoulette() {
            const startBtn = document.getElementById('start-btn');
            const difficulty = document.getElementById('difficulty').value;
            const board = document.getElementById('game-board');
            const timerBox = document.getElementById('timer-box');

            // Reset do Timer
            if (timerInterval) clearInterval(timerInterval);
            timerBox.style.display = 'none';
            timerBox.classList.remove('warning');

            startBtn.disabled = true;

            // Definir categorias com base na dificuldade
            let categories = [dataPool.linkingWords, dataPool.topics];
            if (difficulty === 'medium' || difficulty === 'hard') {
                categories.push(dataPool.fillers, dataPool.idioms);
            }
            if (difficulty === 'hard') {
                categories.push(dataPool.paraphrase, dataPool.tenses);
            }

            // Criar a estrutura dos cards na tela
            board.innerHTML = '';
            const cardElements = categories.map(pool => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card spinning';
                cardEl.innerHTML = `
                    <div>
                        <div class="card-category">${pool[0].title}</div>
                        <div class="card-content">...</div>
                    </div>
                    <div class="card-hint">Girando roleta...</div>
                `;
                board.appendChild(cardEl);
                return { element: cardEl, pool: pool, finalItem: getRandomItem(pool) };
            });

            // Efeito da Roleta Desacelerando
            let step = 0;
            const totalSteps = 25; // Quantidade de rotações

            function spinStep() {
                step++;
                cardElements.forEach(item => {
                    const randomTemp = getRandomItem(item.pool);
                    item.element.querySelector('.card-content').innerText = randomTemp.content;
                    item.element.querySelector('.card-hint').innerText = "💡 " + randomTemp.hint;
                });

                // Som de Tick com frequência ajustada
                playTickSound(350 + step * 10);

                if (step < totalSteps) {
                    // Desaceleração gradual
                    const delay = 50 + Math.pow(step, 1.8);
                    setTimeout(spinStep, delay);
                } else {
                    // Parada Final e Exibição dos Itens Definitivos
                    cardElements.forEach(item => {
                        item.element.classList.remove('spinning');
                        item.element.querySelector('.card-content').innerText = item.finalItem.content;
                        item.element.querySelector('.card-hint').innerText = "💡 " + item.finalItem.hint;
                    });

                    playTickSound(800); // Som de trava final
                    startBtn.disabled = false;

                    // Iniciar o Cronómetro após a roleta parar
                    initTimer();

                    // Salvar no Firestore
                    saveToFirestore(difficulty, cardElements.map(i => i.finalItem.content));
                }
            }

            spinStep();
        }

        function initTimer() {
            const timerSetting = document.getElementById('timer-setting').value;
            const timerBox = document.getElementById('timer-box');
            const timerText = document.getElementById('timer-text');

            if (timerSetting === 'off') return;

            let timeLeft = parseInt(timerSetting);
            timerBox.style.display = 'flex';
            timerText.innerText = `Tempo: ${timeLeft}s`;

            timerInterval = setInterval(() => {
                timeLeft--;
                timerText.innerText = `Tempo: ${timeLeft}s`;

                if (timeLeft <= 10 && timeLeft > 0) {
                    timerBox.classList.add('warning');
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerText.innerText = " Tempo Esgotado!";
                    alert(" O tempo acabou! Verifique se conseguiu usar todas as expressões sorteadas.");
                }
            }, 1000);
        }

        async function saveToFirestore(difficulty, cardsDrawn) {
            try {
                if (window.dbRef && window.addDoc) {
                    await window.addDoc(window.collection(window.dbRef, "ielts_game_sessions"), {
                        difficulty: difficulty,
                        cardsDrawn: cardsDrawn,
                        timestamp: window.serverTimestamp()
                    });
                }
            } catch (e) {}
        }
    </script>
</body>
</html>
