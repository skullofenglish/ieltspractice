<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IELTS Speaking Practice Game</title>
    <!-- Google Fonts: Cinzel Decorative -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-purple: #502064;
            --burgundy: #6B0F1A;
            --charcoal: #1A1A1A;
            --lavender: #6B3A7E;
            --light-lavender: #D8B4D9;
            --pink-accent: #F48FB1;
            --bg-light: #FDF8FE;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Century Gothic', CenturyGothic, AppleGothic, sans-serif;
            background-color: var(--bg-light);
            color: var(--charcoal);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            font-family: 'Cinzel Decorative', serif;
            font-size: 2.2rem;
            color: var(--lavender);
            margin-bottom: 5px;
        }

        p.subtitle {
            font-style: italic;
            color: var(--burgundy);
            font-size: 0.95rem;
            margin-top: 0;
        }

        /* Controls Panel */
        .controls-panel {
            background: var(--white);
            border: 2px solid var(--light-lavender);
            border-radius: 12px;
            padding: 15px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(80, 32, 100, 0.08);
            max-width: 850px;
            width: 100%;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--dark-purple);
        }

        select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--light-lavender);
            font-family: 'Century Gothic', sans-serif;
            background: var(--bg-light);
            color: var(--charcoal);
            outline: none;
            cursor: pointer;
        }

        /* Start Button */
        .start-btn {
            background-color: var(--dark-purple);
            color: var(--white);
            border: none;
            padding: 12px 32px;
            font-size: 1.1rem;
            font-family: 'Cinzel Decorative', serif;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(80, 32, 100, 0.3);
        }

        .start-btn:hover {
            background-color: var(--burgundy);
            transform: translateY(-2px);
        }

        .start-btn:disabled {
            background-color: #aaa;
            cursor: not-allowed;
            transform: none;
        }

        /* Timer Display */
        .timer-container {
            background: var(--dark-purple);
            color: var(--white);
            border: 3px solid var(--pink-accent);
            border-radius: 50px;
            padding: 10px 25px;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(107, 15, 26, 0.2);
            display: none;
            align-items: center;
            gap: 10px;
        }

        .timer-container.warning {
            background: var(--burgundy);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* Cards Grid */
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1000px;
            width: 100%;
            margin-bottom: 30px;
        }

        .card {
            background: var(--white);
            border-radius: 12px;
            border-left: 6px solid var(--lavender);
            box-shadow: 0 4px 15px rgba(80, 32, 100, 0.08);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 140px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card.spinning {
            border-left-color: var(--pink-accent);
            background: #FAF3FA;
        }

        .card-category {
            font-family: 'Cinzel Decorative', serif;
            font-size: 0.9rem;
            color: var(--burgundy);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card-content {
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--dark-purple);
            margin-bottom: 12px;
        }

        .card-hint {
            font-size: 0.85rem;
            color: #555;
            background: var(--bg-light);
            padding: 8px;
            border-radius: 6px;
            border: 1px dashed var(--light-lavender);
        }

        #db-status {
            font-size: 0.8rem;
            color: var(--dark-purple);
            margin-top: auto;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>IELTS Speaking Game</h1>
        <p class="subtitle">Fluency Roulette: Connectors, Expressions, Grammar & Topics in Real Time</p>
    </header>

    <!-- Controls Panel -->
    <div class="controls-panel">
        <div class="control-group">
            <label for="difficulty">Difficulty Level</label>
            <select id="difficulty">
                <option value="easy">Easy (2 Cards)</option>
                <option value="medium" selected>Medium (4 Cards)</option>
                <option value="hard">Master IELTS (6 Cards)</option>
            </select>
        </div>

        <div class="control-group">
            <label for="timer-setting">Response Timer</label>
            <select id="timer-setting">
                <option value="30">30 Seconds</option>
                <option value="45">45 Seconds</option>
                <option value="60" selected>60 Seconds</option>
                <option value="120">120 Seconds (Part 2)</option>
                <option value="off">No Timer</option>
            </select>
        </div>

        <div style="display: flex; align-items: flex-end;">
            <button class="start-btn" id="start-btn" onclick="startRoulette()">Start / Shuffle</button>
        </div>
    </div>

    <!-- Timer Container -->
    <div class="timer-container" id="timer-box">
        ⏱️ <span id="timer-text">Time Remaining: 60s</span>
    </div>

    <!-- Cards Container -->
    <div class="cards-container" id="game-board">
        <div class="card" style="grid-column: 1 / -1; text-align: center; color: #777;">
            Click <strong>"Start / Shuffle"</strong> to spin the speaking roulette!
        </div>
    </div>

    <div id="db-status">Connecting to Firestore...</div>

    <!-- Firebase SDK Modular -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC2pSwDBIREaPmpOvainZzWGuuCEupxp1c",
            authDomain: "studenttrackerpanel.firebaseapp.com",
            projectId: "studenttrackerpanel",
            storageBucket: "studenttrackerpanel.firebasestorage.app",
            messagingSenderId: "1004678184015",
            appId: "1:1004678184015:web:be95625c08d8ee73ffe3a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        document.getElementById('db-status').innerText = "✓ Connected to Firestore successfully!";
        window.dbRef = db;
        window.addDoc = addDoc;
        window.collection = collection;
        window.serverTimestamp = serverTimestamp;
    </script>

    <script>
        // Dataset
        const dataPool = {
            linkingWords: [
                { title: "Linking Word", content: "However / Nevertheless", hint: "Contrast your previous statement." },
                { title: "Linking Word", content: "As a result / Consequently", hint: "Show a direct cause and effect." },
                { title: "Linking Word", content: "Furthermore / In addition", hint: "Add a compelling supporting point." },
                { title: "Linking Word", content: "On the other hand", hint: "Introduce an opposing perspective." },
                { title: "Linking Word", content: "Despite the fact that...", hint: "Use a high-level complex concession." }
            ],
            fillers: [
                { title: "Speaking Filler", content: "Let me think about that for a moment...", hint: "Gain thinking time naturally." },
                { title: "Speaking Filler", content: "Off the top of my head...", hint: "Give an unscripted estimate or thought." },
                { title: "Speaking Filler", content: "To be completely honest...", hint: "Share a frank personal opinion." },
                { title: "Speaking Filler", content: "What I mean to say is...", hint: "Clarify or rephrase your idea." }
            ],
            idioms: [
                { title: "Idiom / Phrasal Verb", content: "Over the moon", hint: "Describe an extremely happy memory or event." },
                { title: "Idiom / Phrasal Verb", content: "Once in a blue moon", hint: "Talk about a very rare habit or occurrence." },
                { title: "Idiom / Phrasal Verb", content: "Catch up with...", hint: "Use the verb to talk about reconnecting with someone." },
                { title: "Idiom / Phrasal Verb", content: "A piece of cake", hint: "Describe an effortless task or situation." },
                { title: "Idiom / Phrasal Verb", content: "Put up with...", hint: "Describe an unpleasant issue you have to tolerate." }
            ],
            paraphrase: [
                { title: "Paraphrase Strategy", content: "In other words...", hint: "Re-explain your previous point simply." },
                { title: "Academic Synonym", content: "Escalate / Surge (≠ Increase)", hint: "Avoid repeating basic words like 'increase'." },
                { title: "Academic Synonym", content: "Crucial / Paramount (≠ Important)", hint: "Elevate your vocabulary of importance." },
                { title: "Paraphrase Strategy", content: "Put simply...", hint: "Summarize a complex concept into simple terms." }
            ],
            tenses: [
                { title: "Target Verb Tense", content: "Present Perfect (have/has done)", hint: "Connect past life experiences to the present." },
                { title: "Target Verb Tense", content: "Past Continuous (was/were doing)", hint: "Describe an ongoing action in the past." },
                { title: "Target Verb Tense", content: "Second Conditional (If + Past, would...)", hint: "Talk about a hypothetical scenario." },
                { title: "Target Verb Tense", content: "Used to + Infinitive", hint: "Discuss past habits that you no longer do." }
            ],
            topics: [
                { title: "IELTS Topic", content: "Technology & AI", hint: "How AI and tech impact daily routines." },
                { title: "IELTS Topic", content: "Environment & Sustainability", hint: "Eco-friendly actions and city pollution." },
                { title: "IELTS Topic", content: "Education & Careers", hint: "The future of jobs and university degrees." },
                { title: "IELTS Topic", content: "Tourism & Cultural Heritage", hint: "Mass tourism and local traditions." },
                { title: "IELTS Topic", content: "Health & Lifestyle", hint: "Physical wellness, sport, and diets." }
            ]
        };

        // Sound Synthesizer (Web Audio API)
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playTickSound(frequency = 400) {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(frequency, ctx.currentTime);
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.04);
            } catch (e) {}
        }

        // Bipe de Aviso (3s, 2s, 1s)
        function playWarningBeep() {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.12);
            } catch (e) {}
        }

        // Alarme de Fim de Tempo (0s)
        function playTimesUpAlarm() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                // Primeiro bipe
                const osc1 = ctx.createOscillator();
                const gain1 = ctx.createGain();
                osc1.type = 'square';
                osc1.frequency.setValueAtTime(880, now);
                gain1.gain.setValueAtTime(0.2, now);
                gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc1.connect(gain1);
                gain1.connect(ctx.destination);
                osc1.start(now);
                osc1.stop(now + 0.15);

                // Segundo bipe curto
                const osc2 = ctx.createOscillator();
                const gain2 = ctx.createGain();
                osc2.type = 'square';
                osc2.frequency.setValueAtTime(1100, now + 0.18);
                gain2.gain.setValueAtTime(0.25, now + 0.18);
                gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc2.connect(gain2);
                gain2.connect(ctx.destination);
                osc2.start(now + 0.18);
                osc2.stop(now + 0.35);
            } catch (e) {}
        }

        let timerInterval = null;

        function getRandomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function startRoulette() {
            const startBtn = document.getElementById('start-btn');
            const difficulty = document.getElementById('difficulty').value;
            const board = document.getElementById('game-board');
            const timerBox = document.getElementById('timer-box');

            // Reset Timer
            if (timerInterval) clearInterval(timerInterval);
            timerBox.style.display = 'none';
            timerBox.classList.remove('warning');

            startBtn.disabled = true;

            // Define categories by difficulty
            let categories = [dataPool.linkingWords, dataPool.topics];
            if (difficulty === 'medium' || difficulty === 'hard') {
                categories.push(dataPool.fillers, dataPool.idioms);
            }
            if (difficulty === 'hard') {
                categories.push(dataPool.paraphrase, dataPool.tenses);
            }

            // Create Card DOM layout
            board.innerHTML = '';
            const cardElements = categories.map(pool => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card spinning';
                cardEl.innerHTML = `
                    <div>
                        <div class="card-category">${pool[0].title}</div>
                        <div class="card-content">...</div>
                    </div>
                    <div class="card-hint">Spinning...</div>
                `;
                board.appendChild(cardEl);
                return { element: cardEl, pool: pool, finalItem: getRandomItem(pool) };
            });

            // Roulette Slowdown Effect
            let step = 0;
            const totalSteps = 25;

            function spinStep() {
                step++;
                cardElements.forEach(item => {
                    const randomTemp = getRandomItem(item.pool);
                    item.element.querySelector('.card-content').innerText = randomTemp.content;
                    item.element.querySelector('.card-hint').innerText = "💡 " + randomTemp.hint;
                });

                playTickSound(350 + step * 10);

                if (step < totalSteps) {
                    const delay = 50 + Math.pow(step, 1.8);
                    setTimeout(spinStep, delay);
                } else {
                    // Final Stop
                    cardElements.forEach(item => {
                        item.element.classList.remove('spinning');
                        item.element.querySelector('.card-content').innerText = item.finalItem.content;
                        item.element.querySelector('.card-hint').innerText = "💡 " + item.finalItem.hint;
                    });

                    playTickSound(800);
                    startBtn.disabled = false;

                    initTimer();
                    saveToFirestore(difficulty, cardElements.map(i => i.finalItem.content));
                }
            }

            spinStep();
        }

        function initTimer() {
            const timerSetting = document.getElementById('timer-setting').value;
            const timerBox = document.getElementById('timer-box');
            const timerText = document.getElementById('timer-text');

            if (timerSetting === 'off') return;

            let timeLeft = parseInt(timerSetting);
            timerBox.style.display = 'flex';
            timerText.innerText = `Time Remaining: ${timeLeft}s`;

            timerInterval = setInterval(() => {
                timeLeft--;
                timerText.innerText = `Time Remaining: ${timeLeft}s`;

                if (timeLeft <= 10 && timeLeft > 0) {
                    timerBox.classList.add('warning');
                }

                // Bipe nos 3, 2 e 1 segundos finais
                if (timeLeft <= 3 && timeLeft > 0) {
                    playWarningBeep();
                }

                // Fim de tempo
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerText.innerText = "⏱️ Time's Up!";
                    playTimesUpAlarm();
                    setTimeout(() => {
                        alert("Time's up! Check if you managed to incorporate all drawn cards into your speech.");
                    }, 50);
                }
            }, 1000);
        }

        async function saveToFirestore(difficulty, cardsDrawn) {
            try {
                if (window.dbRef && window.addDoc) {
                    await window.addDoc(window.collection(window.dbRef, "ielts_game_sessions"), {
                        difficulty: difficulty,
                        cardsDrawn: cardsDrawn,
                        timestamp: window.serverTimestamp()
                    });
                }
            } catch (e) {}
        }
    </script>
</body>
</html>
